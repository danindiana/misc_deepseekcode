[package]
name = "inter-system-communication"
version = "1.0.0"
edition = "2021"
authors = ["Inter-System Communication Language Team"]
description = "RNN Encoder-Decoder implementations in Rust"
license = "MIT"
repository = "https://github.com/danindiana/misc_deepseekcode"

[dependencies]
# Linear Algebra
ndarray = "0.15"
ndarray-linalg = "0.16"

# Machine Learning
tch = "0.14"  # PyTorch bindings for Rust

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
rand = "0.8"
rayon = "1.8"  # Parallel computing

[dev-dependencies]
criterion = "0.5"  # Benchmarking
proptest = "1.4"   # Property testing

[[example]]
name = "rnn_encoder_decoder"
path = "examples/rust/rnn_encoder_decoder.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
